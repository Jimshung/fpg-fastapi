name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 同一個分支上的新 push 會取代舊的檢查
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -r requirements-bid.txt

      - name: Run tests
        # Settings 匯入時要求這些欄位；測試不會真的連線，用假值即可
        env:
          FPG_USERNAME: ci-user
          FPG_PASSWORD: ci-password
          LOGIN_URL: https://example.invalid/login
        run: python -m pytest -q
