name: FPG / PCC 歸檔 (HTTP → Notion)

on:
  # 備援排程：GitHub schedule 常延遲數小時，改避開整點；
  # 主要觸發改由外部排程器（cron-job.org）呼叫 workflow_dispatch。
  schedule:
    # GitHub cron 用 UTC；台北 = UTC+8
    # 08:17 台塑＋PCC；09–12 點台塑再跑，PCC 也各探測一次（PCC 用 --catch-up，
    # 只補尚未歸檔的案件；Notion upsert 可重入）
    - cron: "17 0 * * 1-5"
    - cron: "17 1-4 * * 1-5"
    # 16:17 僅 PCC（探測＋補洞）
    - cron: "17 8 * * 1-5"
  workflow_dispatch:
    inputs:
      job:
        description: "要跑哪個歸檔（外部排程器用）"
        type: choice
        options:
          - all
          - fpg
          - pcc
        default: all
      attempt:
        description: "PCC 自動重跑的第幾次嘗試（內部使用，手動請留 1）"
        type: string
        default: "1"

jobs:
  run-archive:
    name: FPG 標售歸檔  # watchdog.yml 依此名稱檢查，改名要一起改
    # 排程：16:17 略過；手動／外部觸發：job 不是 pcc 就跑
    if: >
      (github.event_name == 'schedule' && github.event.schedule != '17 8 * * 1-5') ||
      (github.event_name == 'workflow_dispatch' && inputs.job != 'pcc')
    runs-on: ubuntu-latest
    # 同一時間只跑一個 FPG 歸檔（排程與外部觸發重疊時排隊，不取消進行中的）
    concurrency:
      group: archive-fpg
      cancel-in-progress: false
    env:
      LOGIN_URL: ${{ secrets.LOGIN_URL }}
      FPG_USERNAME: ${{ secrets.FPG_USERNAME }}
      FPG_PASSWORD: ${{ secrets.FPG_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      ENABLE_TELEGRAM_NOTIFY: "true"
      TZ: Asia/Taipei
      ACTIONS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run archive (today, Taiwan only)
        id: archive
        run: |
          set -o pipefail
          START_TIME=$(date +%s)
          DIGEST_FILE=telegram_digest.txt
          mkdir -p app/utils/screenshots/archive_downloads

          EXIT_CODE=1
          for ATTEMPT in 1 2 3; do
            echo "===== FPG archive attempt ${ATTEMPT}/3 ====="
            # 預設略過桌面 view 調整，避免 Views API 偶發失敗中斷歸檔
            set +e
            python -m app.scripts.run_archive --skip-notion-view --digest-file "$DIGEST_FILE" 2>&1 | tee -a archive.log
            EXIT_CODE=${PIPESTATUS[0]}
            set -e
            if [ "$EXIT_CODE" -eq 0 ]; then
              break
            fi
            if [ "$ATTEMPT" -lt 3 ]; then
              echo "archive failed (exit=${EXIT_CODE}); cooling 90s before retry..."
              sleep 90
            fi
          done

          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          EXEC_TIME=$(TZ='Asia/Taipei' date '+%Y-%m-%d %H:%M:%S')
          echo "EXECUTION_TIME=$EXEC_TIME" >> "$GITHUB_ENV"
          echo "EXECUTION_DURATION=$DURATION" >> "$GITHUB_ENV"

          if [ ! -f "$DIGEST_FILE" ]; then
            printf '%s\n' "❌ 台塑歸檔未產生 digest（腳本可能提早失敗）" > "$DIGEST_FILE"
          fi
          # 結尾寫進同一檔，Telegram 只讀 message_file（純文字、無 HTML）
          TRIGGER_LABEL='手動'
          if [ "${{ github.event_name }}" = "schedule" ]; then
            TRIGGER_LABEL='排程'
          fi
          {
            printf '\n'
            printf '⏱ %s｜%ss｜%s\n' "$EXEC_TIME" "$DURATION" "$TRIGGER_LABEL"
            printf 'Actions: %s\n' "$ACTIONS_RUN_URL"
          } >> "$DIGEST_FILE"

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            exit "$EXIT_CODE"
          fi

      - name: 顯示執行資訊
        if: always()
        run: |
          echo "============執行資訊============"
          echo "執行時間: $EXECUTION_TIME"
          echo "執行耗時: $EXECUTION_DURATION 秒"
          echo "觸發方式: ${{ github.event_name }}"
          echo "執行狀態: ${{ steps.archive.outputs.status }}"
          echo "================================"

      # 純文字 + message_file；通知失敗不拖垮歸檔結果
      - name: 發送 Telegram 通知
        if: always()
        continue-on-error: true
        uses: appleboy/telegram-action@214f06cfa3d3a588c1472116889437e7c6fd29b1 # v1.1.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          disable_web_page_preview: true
          message_file: telegram_digest.txt

      # 投標紀錄：歷史資料已報價案件 → 報價單截圖存進 Notion。
      # 用機器內建 Chrome（免下載）；步驟自有時限，失敗只推 Telegram，不影響歸檔結果。
      - name: 投標紀錄截圖 (FPG 歷史資料)
        id: bid
        if: steps.archive.outputs.status == 'success'
        continue-on-error: true
        timeout-minutes: 8
        run: |
          set -o pipefail  # 否則 tee 會蓋掉 python 的失敗碼，失敗通知不會發
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-wqy-microhei
          pip install -r requirements-bid.txt
          python -m app.scripts.run_bid_history --login-retries 3 2>&1 | tee bid_history.log

      - name: 投標紀錄失敗通知
        if: steps.bid.outcome == 'failure'
        continue-on-error: true
        uses: appleboy/telegram-action@214f06cfa3d3a588c1472116889437e7c6fd29b1 # v1.1.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          disable_web_page_preview: true
          message: |
            ⚠️ FPG 投標紀錄截圖失敗（歸檔本身已完成，不受影響）
            Actions: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: archive-logs
          path: |
            archive.log
            bid_history.log
            telegram_digest.txt
          retention-days: 5

  run-pcc-archive:
    name: PCC 財物變賣歸檔  # watchdog.yml 依此名稱檢查，改名要一起改
    # 排程：08:17、09–12 每小時、16:17 各探測一次；手動／外部觸發：job 不是 fpg 就跑
    # PCC 封鎖是間歇的：每次只探測一次、被擋就結束，放行時用 --catch-up 補齊缺口
    if: >
      (github.event_name == 'schedule' &&
        (github.event.schedule == '17 0 * * 1-5' ||
         github.event.schedule == '17 1-4 * * 1-5' ||
         github.event.schedule == '17 8 * * 1-5')) ||
      (github.event_name == 'workflow_dispatch' && inputs.job != 'fpg')
    runs-on: ubuntu-latest
    # 同一時間只跑一個 PCC 歸檔；排隊中的被新的取代無妨（--catch-up 會補齊）
    concurrency:
      group: archive-pcc
      cancel-in-progress: false
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      PCC_NOTION_DATABASE_ID: ${{ secrets.PCC_NOTION_DATABASE_ID }}
      PCC_PROXY_URL: ${{ secrets.PCC_PROXY_URL }}
      PCC_PROXY_KEY: ${{ secrets.PCC_PROXY_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ENABLE_TELEGRAM_NOTIFY: "true"
      TZ: Asia/Taipei
      # Settings 啟動仍需要 FPG 帳密欄位（PCC job 不登入 FPG）
      FPG_USERNAME: ${{ secrets.FPG_USERNAME }}
      FPG_PASSWORD: ${{ secrets.FPG_PASSWORD }}
      LOGIN_URL: ${{ secrets.LOGIN_URL }}
      ACTIONS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    timeout-minutes: 30
    outputs:
      waf_blocked: ${{ steps.pcc.outputs.waf_blocked }}
      relay_down: ${{ steps.relay.outputs.relay_down }}

    steps:
      - uses: actions/checkout@v5

      # 先確認 GAS 代理活著、金鑰有效（不碰 PCC）：不帶 url 時，
      # 金鑰正確會回 400 "url not allowed"，錯誤會回 403 "forbidden"。
      - name: 檢查 PCC 代理
        id: relay
        run: |
          if [ -z "$PCC_PROXY_URL" ]; then
            echo "未設定 PCC_PROXY_URL，略過代理檢查（直連模式）"
            exit 0
          fi
          RESP=$(curl -sS -L --max-time 30 --get \
            --data-urlencode "key=${PCC_PROXY_KEY}" "$PCC_PROXY_URL" || true)
          if [ "$(printf '%s' "$RESP" | jq -r '.error // empty' 2>/dev/null)" = "url not allowed" ]; then
            echo "代理正常"
            exit 0
          fi
          echo "代理異常，回應開頭：$(printf '%s' "$RESP" | head -c 200)"
          echo "relay_down=true" >> "$GITHUB_OUTPUT"
          {
            printf '%s\n' "❌ PCC 代理無法使用（GAS 掛了、授權過期或金鑰失效）"
            printf '%s\n' "請檢查 GAS 專案「PCC 轉發代理」的部署與授權"
            printf 'Actions: %s\n' "$ACTIONS_RUN_URL"
          } > telegram_digest.txt
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run PCC archive (announce date)
        id: pcc
        run: |
          set -o pipefail
          START_TIME=$(date +%s)
          DIGEST_FILE=telegram_digest.txt

          # 預設 bash -e + pipefail 會在腳本失敗時直接中斷，後面讀不到結束碼
          set +e
          python -m app.scripts.run_pcc_archive --catch-up --skip-notion-view --digest-file "$DIGEST_FILE" 2>&1 | tee pcc_archive.log
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          EXEC_TIME=$(TZ='Asia/Taipei' date '+%Y-%m-%d %H:%M:%S')
          echo "PCC_EXECUTION_TIME=$EXEC_TIME" >> "$GITHUB_ENV"
          echo "PCC_EXECUTION_DURATION=$DURATION" >> "$GITHUB_ENV"

          if [ ! -f "$DIGEST_FILE" ]; then
            printf '%s\n' "❌ 政府財物歸檔未產生 digest（腳本可能提早失敗）" > "$DIGEST_FILE"
          fi
          TRIGGER_LABEL='手動'
          if [ "${{ github.event_name }}" = "schedule" ]; then
            TRIGGER_LABEL='排程'
          fi
          {
            printf '\n'
            printf '⏱ %s｜%ss｜%s\n' "$EXEC_TIME" "$DURATION" "$TRIGGER_LABEL"
            printf 'Actions: %s\n' "$ACTIONS_RUN_URL"
          } >> "$DIGEST_FILE"

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            # 結束碼 3 = 遭 WAF 封鎖：不立刻重跑，等下一個排程時段再探測
            if [ "$EXIT_CODE" -eq 3 ]; then
              echo "waf_blocked=true" >> "$GITHUB_OUTPUT"
            fi
            exit "$EXIT_CODE"
          fi

      - name: 發送 Telegram 通知 (PCC)
        if: always()
        continue-on-error: true
        uses: appleboy/telegram-action@214f06cfa3d3a588c1472116889437e7c6fd29b1 # v1.1.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          disable_web_page_preview: true
          message_file: telegram_digest.txt

      - name: Upload PCC logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pcc-archive-logs
          path: |
            pcc_archive.log
            telegram_digest.txt
          retention-days: 5

  # 非 WAF 的失敗（網路抖動、Notion 錯誤等）時另開一次「只跑 PCC」的新 run。
  # WAF 封鎖（waf_blocked）不重跑：實測封鎖與 IP 無關，換機器沒用，等下一個排程時段。
  # 最多 3 次嘗試（inputs.attempt），避免無限循環。
  retry-pcc:
    name: PCC 失敗自動重跑
    needs: run-pcc-archive
    if: >
      always() && needs.run-pcc-archive.result == 'failure' &&
      needs.run-pcc-archive.outputs.waf_blocked != 'true' &&
      needs.run-pcc-archive.outputs.relay_down != 'true' &&
      fromJSON(inputs.attempt || '1') < 3
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: 等待後重新觸發 PCC
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_ATTEMPT: ${{ inputs.attempt || '1' }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          NEXT_ATTEMPT=$((CURRENT_ATTEMPT + 1))
          echo "PCC 第 ${CURRENT_ATTEMPT} 次失敗（非 WAF 封鎖），60 秒後觸發第 ${NEXT_ATTEMPT} 次"
          sleep 60
          gh workflow run automation.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$REF_NAME" \
            -f job=pcc \
            -f attempt="$NEXT_ATTEMPT"
