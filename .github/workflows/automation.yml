name: FPG / PCC 歸檔 (HTTP → Notion)

on:
  schedule:
    # GitHub cron 用 UTC；台北 = UTC+8
    # 週一至週五 台北 08:00
    - cron: "0 0 * * 1-5"
    # 週一至週五 台北 16:00
    - cron: "0 8 * * 1-5"
  workflow_dispatch:

jobs:
  run-archive:
    name: FPG 標售歸檔
    runs-on: ubuntu-latest
    env:
      LOGIN_URL: ${{ secrets.LOGIN_URL }}
      USERNAME: ${{ secrets.USERNAME }}
      PASSWORD: ${{ secrets.PASSWORD }}
      AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
      AZURE_API_KEY: ${{ secrets.AZURE_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      ENABLE_TELEGRAM_NOTIFY: "true"
      ENVIRONMENT: production
      TZ: Asia/Taipei
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run archive (today, Taiwan only)
        id: archive
        run: |
          set -o pipefail
          START_TIME=$(date +%s)
          DIGEST_FILE=telegram_digest.txt

          mkdir -p app/utils/screenshots/archive_downloads

          # 預設略過桌面 view 調整，避免 Views API 偶發失敗中斷歸檔
          python -m app.scripts.run_archive --skip-notion-view --digest-file "$DIGEST_FILE" 2>&1 | tee archive.log
          EXIT_CODE=${PIPESTATUS[0]}

          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "EXECUTION_TIME=$(TZ='Asia/Taipei' date '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"
          echo "EXECUTION_DURATION=$DURATION" >> "$GITHUB_ENV"

          if [ ! -f "$DIGEST_FILE" ]; then
            printf '%s\n' "❌ 台塑歸檔未產生 digest（腳本可能提早失敗）" > "$DIGEST_FILE"
          fi
          {
            echo "digest<<EOF"
            cat "$DIGEST_FILE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            exit "$EXIT_CODE"
          fi

      - name: 顯示執行資訊
        if: always()
        run: |
          echo "============執行資訊============"
          echo "執行時間: $EXECUTION_TIME"
          echo "執行耗時: $EXECUTION_DURATION 秒"
          echo "觸發方式: ${{ github.event_name }}"
          echo "執行狀態: ${{ steps.archive.outputs.status }}"
          echo "================================"

      - name: 發送 Telegram 通知
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          disable_web_page_preview: true
          message: |
            ${{ steps.archive.outputs.digest }}

            ⏱ ${{ env.EXECUTION_TIME }}｜${{ env.EXECUTION_DURATION }}s｜${{ github.event_name == 'schedule' && '排程' || '手動' }}
            <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">Actions log</a>

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-logs
          path: |
            archive.log
            telegram_digest.txt
          retention-days: 5

  run-pcc-archive:
    name: PCC 財物變賣歸檔
    runs-on: ubuntu-latest
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      PCC_NOTION_DATABASE_ID: ${{ secrets.PCC_NOTION_DATABASE_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ENABLE_TELEGRAM_NOTIFY: "true"
      ENVIRONMENT: production
      TZ: Asia/Taipei
      # FPG 設定類仍可能被 Settings 要求
      USERNAME: ${{ secrets.USERNAME }}
      PASSWORD: ${{ secrets.PASSWORD }}
      LOGIN_URL: ${{ secrets.LOGIN_URL }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run PCC archive (announce date)
        id: pcc
        run: |
          set -o pipefail
          START_TIME=$(date +%s)
          DIGEST_FILE=telegram_digest.txt

          python -m app.scripts.run_pcc_archive --skip-notion-view --digest-file "$DIGEST_FILE" 2>&1 | tee pcc_archive.log
          EXIT_CODE=${PIPESTATUS[0]}

          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "PCC_EXECUTION_TIME=$(TZ='Asia/Taipei' date '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"
          echo "PCC_EXECUTION_DURATION=$DURATION" >> "$GITHUB_ENV"

          if [ ! -f "$DIGEST_FILE" ]; then
            printf '%s\n' "❌ 政府財物歸檔未產生 digest（腳本可能提早失敗）" > "$DIGEST_FILE"
          fi
          {
            echo "digest<<EOF"
            cat "$DIGEST_FILE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            exit "$EXIT_CODE"
          fi

      - name: 發送 Telegram 通知 (PCC)
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          disable_web_page_preview: true
          message: |
            ${{ steps.pcc.outputs.digest }}

            ⏱ ${{ env.PCC_EXECUTION_TIME }}｜${{ env.PCC_EXECUTION_DURATION }}s｜${{ github.event_name == 'schedule' && '排程' || '手動' }}
            <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">Actions log</a>

      - name: Upload PCC logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcc-archive-logs
          path: |
            pcc_archive.log
            telegram_digest.txt
          retention-days: 5
